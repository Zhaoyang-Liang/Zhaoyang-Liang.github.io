{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

{% if site.atom_feed.hide != true %}
<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endif %}

<meta name="viewport" content="width=device-width, initial-scale=1.0">

{% if page.lang_switch %}
<link rel="alternate" hreflang="{% if page.lang == 'en' %}zh-CN{% else %}en{% endif %}" href="{{ page.lang_switch | absolute_url }}">
{% endif %}

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
